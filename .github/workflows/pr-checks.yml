name: PR checks

on:
  pull_request:
    branches:
      - dev
      - master
  push:
    branches:
      - dev
      - master

permissions:
  contents: read

jobs:
  quality:
    name: Lint and type-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          python-version: '3.13'

      - name: Sync dependencies
        run: uv sync --locked --group dev

      - name: Run Ruff
        run: uv run --frozen ruff check .
      - name: Run mypy
        run: uv run --frozen mypy

      - name: Run pylint
        run: uv run --frozen pylint apps django_crm manage.py

      - name: Run Django system checks
        run: uv run --frozen python manage.py check --settings=django_crm.settings.test

  tests:
    name: Pytest
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          python-version: '3.13'

      - name: Sync dependencies
        run: uv sync --locked --group dev

      - name: Run pytest
        run: uv run --frozen pytest

  coverage:
    name: Test coverage
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          python-version: '3.13'

      - name: Sync dependencies
        run: uv sync --locked --group dev

      - name: Run tests with coverage
        run: |
          uv run --frozen coverage run -m pytest
          uv run --frozen coverage report
          uv run --frozen coverage xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: true